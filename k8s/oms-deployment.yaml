---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms-webapp
  labels:
    app: oms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oms
  template:
    metadata:
      labels:
        app: oms
    spec:
      containers:
        - name: oms
          image: slaff/reclame-oms:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PUBLIC_SUPABASE_URL
              value: "http://reclame-supabase.local:8000"
            - name: PUBLIC_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: oms-secrets
                  key: supabase-anon-key
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: oms-secrets
                  key: supabase-service-role-key
            - name: PUBLIC_APP_URL
              value: "http://reclame-orch.local"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: oms-service
  labels:
    app: oms
spec:
  type: ClusterIP
  selector:
    app: oms
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oms-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: reclame-orch.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oms-service
                port:
                  number: 80
