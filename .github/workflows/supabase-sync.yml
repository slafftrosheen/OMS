name: Sync Supabase Schema

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  sync-schema:
    runs-on: ubuntu-latest
    name: Sync schema to Supabase
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check for migration changes
        id: migration_check
        run: |
          # Check if there are any migration files in the commit
          if git diff --name-only HEAD^ HEAD | grep -q "supabase/migrations/"; then
            echo "migration_changes=true" >> $GITHUB_OUTPUT
          else
            echo "migration_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync schema to remote database
        if: steps.migration_check.outputs.migration_changes == 'true'
        run: |
          # Check if PROJECT_ID and SUPABASE_DB_PASSWORD are set
          if [ -z "$PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Missing required secrets. Please set SUPABASE_PROJECT_ID and SUPABASE_DB_PASSWORD."
            exit 1
          fi
          
          # Link to the Supabase project
          supabase link --project-ref $PROJECT_ID
          
          # Set the database password as an environment variable
          echo "Setting database password..."
          supabase db remote set --password $SUPABASE_DB_PASSWORD
          
          # Push the schema changes to the remote database
          supabase db push
          
      - name: Push new migrations to remote
        if: steps.migration_check.outputs.migration_changes == 'true'
        run: |
          # Generate migration files if there are any local migrations that haven't been applied remotely
          supabase migration list
          
          # Apply any new migrations to the remote database
          supabase db push