name: OMS validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oms-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked source for reproducible diagnostics
        run: git archive --format=tar.gz --output=oms-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oms-source-${{ github.sha }}
          path: oms-source.tar.gz
          retention-days: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install vector conversion test dependency
        run: sudo apt-get update && sudo apt-get install -y ghostscript
      - run: npm ci --no-audit --no-fund
      - name: Archive compiler tools for offline diagnostics
        run: tar -czf oms-compiler.tar.gz node_modules/svelte node_modules/typescript node_modules/esbuild node_modules/@esbuild
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oms-compiler-${{ github.sha }}
          path: oms-compiler.tar.gz
          retention-days: 1
      - name: Source tests
        id: source_tests
        continue-on-error: true
        run: npm test
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: npm run test:unit
      - name: Svelte and TypeScript
        id: check
        continue-on-error: true
        run: npm run check
      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Require all validation gates
        if: always()
        env:
          SOURCE_TESTS: ${{ steps.source_tests.outcome }}
          UNIT_TESTS: ${{ steps.unit_tests.outcome }}
          CHECK: ${{ steps.check.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          test "$SOURCE_TESTS" = success &&
          test "$UNIT_TESTS" = success &&
          test "$CHECK" = success &&
          test "$BUILD" = success
