# Reference Nginx reverse proxy for the current OMS adapter-node service.
# Current deployment: SvelteKit on the host (systemd), Supabase in a separate
# stack. All /api/* routes including /api/toolkit/assets/* belong to SvelteKit.
# Verify the active Nginx/Traefik config; this file isn't applied automatically.
events { worker_connections 1024; }
http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    upstream oms_app {
        server 127.0.0.1:3000;
    }
    server {
        listen 80;
        server_name localhost;

        # 25 MiB file plus multipart overhead; must also set
        # BODY_SIZE_LIMIT=32M for the running SvelteKit process.
        client_max_body_size 32m;
        client_body_timeout 120s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        location / {
            proxy_pass http://oms_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
