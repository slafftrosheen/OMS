<svg xmlns="http://www.w3.org/2000/svg" width="960" height="655" viewBox="0 0 960 655" role="img" aria-labelledby="trace-title trace-description">
  <title id="trace-title">Raster tracing: measured before and after</title>
  <desc id="trace-description">Actual traces of identical 128 by 128 pixel binary fixtures: a rounded rectangle with width 96, height 64, and corner radius 14, and a disk of radius 44. Top row uses commit 7f10ef791b5f78fd43d4251e1f189f6cf8b3b70c and its original defaults. Bottom row uses the new pipeline defaults. Gray silhouettes are reconstructed directly from black source pixels. Orange and teal outlines use the actual returned Bézier control coordinates; white dots mark actual editable anchor nodes. Curved spans count non-collinear control points, so straight cubic commands do not count as curves. Maximum deviations are independently sampled distances to the analytic shapes that generated these synthetic sources, not universal tracing accuracy guarantees. Generated from the source hashes in metadata.</desc>
